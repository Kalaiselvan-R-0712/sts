<!DOCTYPE html> 
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | STACKLY</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=DM+Serif+Display&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
  
  <style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  color: #222;
  background: linear-gradient(135deg,#F7F0FF,#F7F0FF,#F7F0FF);
}
    .error-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error-page h1 {
      font-size: 6rem;
      font-weight: 700;
      color: #A70FF9;
      margin-bottom: 0.5rem;
      text-shadow: 0 8px 25px rgba(223,255,24,.30);
    }
    .error-page h2 {
      font-size: 1.6rem;
      margin-bottom: 1rem;
      color: #A70FF9;
      font-family: 'Merriweather', serif;
    }
    .error-page p {
      max-width: 600px;
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
      color: #555;
    }
    .btn-home {
      display: inline-block;
      background: linear-gradient(135deg,#C084FC,#A70FF9);
      color: #fff;
      padding: 0.75em 1.8em;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: transform 0.25s, box-shadow 0.3s;
      box-shadow: 0 10px 25px rgba(167,15,249,.25);
    }
.btn-home:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 18px 40px rgba(167,15,249,.40);
}
  </style>

  <style>
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    /* Small devices (phones) */
    @media (max-width: 600px) {
      .hero h1 { font-size: 2rem; }
      .shop-grid { gap: 1rem; }
    }

    /* Tablets */
    @media (min-width: 601px) and (max-width: 1024px) {
      .hero h1 { font-size: 2.5rem; }
      .shop-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    }

    /* Large screens (laptops, desktops) */
    @media (min-width: 1025px) {
      .hero h1 { font-size: 3rem; }
    }

    img, video {
      max-width: 100%;
      height: auto;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
    }

.btn-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.btn-back{
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
}

</style>
</head>

<body>
  <main class="error-page">
    <h1>404</h1>
    <h2>Oops! Page Not Found</h2>
    <p>
      Sorry, the page you’re looking for doesn’t exist or has been moved. <br>
      Let’s get you back on track.
    </p>
    <div class="btn-group">
    <button class="btn-home btn-back" onclick="goBack()">⬅ Back to Previous Page</button>
    <a href="homepage2.html" class="btn-home">🏠 Back to Home</a>
</div>
  </main>

  <script>
    document.getElementById("year")?.textContent = new Date().getFullYear();
  </script>

<script>
function goBack() {
    if (window.history.length > 1) {
        window.history.back();
    } else {
        window.location.href = "homepage2.html";
    }
}
</script>

</body>
</html>
